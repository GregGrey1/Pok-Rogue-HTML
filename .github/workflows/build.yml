name: Build single-file PokeRogue

on:
  workflow_dispatch:
    inputs:
      color:
        description: "Solid color (hex, no #) for shiny/variant sprites"
        default: "f5c518"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build pokerogue.html
        run: python3 pokerogue_single.py --color "${{ github.event.inputs.color || 'f5c518' }}" --out pokerogue.html

      - name: Check output
        run: ls -lh pokerogue.html

      - uses: actions/upload-artifact@v4
        with:
          name: pokerogue-html
          path: pokerogue.html
          compression-level: 0
          retention-days: 7
